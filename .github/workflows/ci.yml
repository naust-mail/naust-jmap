name: CI

# go.work multi-module workspace. `go build ./...` from the root fails by
# design, but naming each module's package pattern works, so the workspace
# checks are ordinary single commands.
#
#   gate     - modules built against the sibling code in this checkout.
#   consumer - GOWORK=off, so each module resolves the graph its own go.mod
#              declares. go.work unifies the build list, so workspace mode can
#              test against a dependency version no consumer selects; that hid
#              an x/text advisory. Build and vulncheck only: gate already
#              tested this source.
#   minimum  - the Go 1.24 support claim, on a real 1.24 toolchain.

on:
  push:
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  PKGS: ./core/... ./datatypes/mail/... ./capabilities/websocket/... ./drivers/sqlite/... ./drivers/postgres/... ./examples/...

jobs:
  gate:
    runs-on: ubuntu-latest

    # Only this job runs tests, so it is the only one needing a server. The
    # Postgres driver and cluster suite read PG_TEST_DSN and skip without it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_TEST_DSN: postgres://postgres:test@localhost:5432/postgres

    steps:
      # Actions pinned to full commit SHAs (trailing comment names the tag the
      # SHA came from), so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # stable, not go-version-file: go.work pins an exact patch release, and
      # an unpatched toolchain makes govulncheck report every stdlib advisory
      # fixed since it.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "not gofmt'd: $unformatted"; exit 1; }

      - name: Build
        run: go build $PKGS

      - name: Vet
        run: go vet $PKGS

      # -v and the summary because a skipped test is not a passing test. Some
      # skip on a precondition the runner does not meet (root cannot provoke a
      # permission failure; the Postgres suites need PG_TEST_DSN), and the
      # default output reports the package ok either way.
      - name: Test
        run: |
          set -o pipefail
          go test -race -v $PKGS 2>&1 | tee test.log
          status=$?
          echo "::group::skipped"
          grep -E '^\s*--- SKIP' test.log || echo "(none)"
          echo "::endgroup::"
          exit $status

  consumer:
    runs-on: ubuntu-latest

    # Quoted: bare off is a YAML boolean, and Go rejects GOWORK=false.
    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      # Pinned rather than @latest: an unpinned installer is a supply-chain
      # hole, same reasoning as the action SHAs.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      # Own stdlib-only module, outside go.work. vulngate fails on anything
      # unaccepted, and on an accepted advisory that becomes reachable through a
      # symbol nobody reviewed. See .github/SECURITY.md.
      - name: Build vulngate
        working-directory: .github/tools/vulngate
        run: go build -o "$RUNNER_TEMP/vulngate" .

      # datatypes/mail carries the x/text pin and the accepted advisory, and is
      # imported directly. examples has the largest dependency closure, so it
      # covers the drivers' published graphs. core and capabilities/websocket
      # are stdlib-only, so their consumer graph is empty.
      - name: datatypes/mail
        working-directory: datatypes/mail
        run: go build ./... && "$RUNNER_TEMP/vulngate"

      - name: examples
        working-directory: examples
        run: go build ./... && "$RUNNER_TEMP/vulngate"

  # core, capabilities/websocket and datatypes/mail declare go 1.24. The rest
  # require 1.25.0 because modernc.org/sqlite, modernc.org/libc and
  # jackc/pgx/v5 do.
  #
  # GOWORK=off is required, not preferred: go.work declares 1.25.0, and in
  # workspace mode that floor applies to every member. It also means each
  # module must be built from its own directory.
  minimum:
    runs-on: ubuntu-latest

    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"

      - name: core
        working-directory: core
        run: go build ./...

      - name: capabilities/websocket
        working-directory: capabilities/websocket
        run: go build ./...

      - name: datatypes/mail
        working-directory: datatypes/mail
        run: go build ./...
